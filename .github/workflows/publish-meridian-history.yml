name: Publish Meridian history
on:
  push:
    paths: ['.github/workflows/publish-meridian-history.yml']
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency: meridian-historical-releases
jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and verify every version before publishing
        env:
          MERIDIAN_MODULE_CACHE: ${{ runner.temp }}/swift-modules
        run: |
          set -euo pipefail
          git log --first-parent --reverse --format='%H %s' | awk '$2 == "Meridian" && $3 ~ /^[0-9]+\.[0-9]+\.[0-9]+$/ {print $1, $3}' > "$RUNNER_TEMP/versions"
          test "$(wc -l < "$RUNNER_TEMP/versions" | tr -d ' ')" = 15
          while read -r commit version <&3; do
            src="$RUNNER_TEMP/source-$version"
            out="$RUNNER_TEMP/build-$version"
            git worktree add --detach "$src" "$commit"
            "$src/build.sh" "$out"
            app="$out/Meridian.app"
            test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$version"
            lipo "$app/Contents/MacOS/Meridian" -verify_arch arm64 x86_64
            codesign --verify --deep --strict "$app"
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Meridian-$version-macOS.zip"
            unzip -tq "$RUNNER_TEMP/Meridian-$version-macOS.zip"
          done 3< "$RUNNER_TEMP/versions"
      - name: Publish in original build order
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while read -r commit version; do
            tag="v$version"
            if gh release view "$tag" >/dev/null 2>&1; then
              test "$(git rev-parse "$tag^{commit}")" = "$commit"
              continue
            fi
            case "$version" in
              1.0.0) note="Initial menu bar converter with text entry, screenshot recognition, and selectable time zones." ;;
              1.1.0) note="Persistent converter panel, larger local date, and separate text and screenshot inputs." ;;
              1.2.0) note="Side-by-side detected and converted dates and times." ;;
              1.3.0) note="Chosen time zone clock in the menu bar." ;;
              1.3.1) note="Optional live clock for the detected time zone." ;;
              1.4.0) note="Compact yearless menu bar dates and times for both zones." ;;
              1.4.1|1.4.2) note="Menu bar clock sizing and placement refinements." ;;
              1.4.3) note="Improved menu bar icon and converter panel positioning." ;;
              1.5.0) note="Liquid Glass navigation and adaptive appearance." ;;
              1.6.0) note="Native Settings commands, grouped preferences, and keyboard navigation." ;;
              1.6.1) note="Time zone names with UTC offsets and animated screen transitions." ;;
              1.6.2) note="Directional submenu transitions and a clickable native image picker." ;;
              1.6.3) note="Coordinated sliding pages, a home-screen Quit button, and a clock second hand." ;;
              1.6.4) note="Screenshot previews, cancellable recognition, and improved image import responsiveness." ;;
            esac
            gh release create "$tag" "$RUNNER_TEMP/Meridian-$version-macOS.zip" --target "$commit" --title "Meridian $version" --notes "$note

          Universal macOS app for Apple silicon and Intel. Ad-hoc signed and unnotarized."
          done < "$RUNNER_TEMP/versions"
